name: Pruebas del proyecto

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ejecutar-pruebas:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo del repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

      - name: Instalar Chromium para pruebas E2E
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas E2E
        run: npm run test:e2e